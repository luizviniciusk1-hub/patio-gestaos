<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pátio Gestão</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172033;background:#f5f7fb}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,.button{cursor:pointer}
.app{display:flex;min-height:100vh}.sidebar{width:250px;background:#101827;color:#dbe3f0;padding:18px 12px;display:flex;flex-direction:column;gap:6px;transition:.2s}.sidebar.collapsed{width:74px}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;padding:12px 10px;margin-bottom:16px}.brand svg{color:#6ea8fe}.brand.large{font-size:24px;justify-content:center}.nav{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:#aebbd0;text-decoration:none;border:0;background:none;width:100%;text-align:left}.nav:hover,.nav.active{background:#1d2a3d;color:#fff}.logout{margin-top:auto}.main{flex:1;min-width:0}header{height:66px;background:#fff;border-bottom:1px solid #e5e9f0;display:flex;align-items:center;gap:14px;padding:0 24px;position:sticky;top:0;z-index:5}.iconbtn{border:0;background:transparent;padding:8px;border-radius:8px;color:#536177;display:flex;align-items:center}.iconbtn:hover{background:#f0f3f8}.content{padding:26px;max-width:1600px;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:16px}.page-title h1{margin:0;font-size:27px}.grid{display:grid;gap:18px}.grid.cards{grid-template-columns:repeat(6,minmax(0,1fr));margin-bottom:20px}.grid.two{grid-template-columns:repeat(2,minmax(0,1fr));margin-bottom:20px}.card,.panel{background:#fff;border:1px solid #e6eaf0;border-radius:13px;box-shadow:0 3px 12px #1720330a}.card{padding:18px;display:flex;gap:14px;align-items:center}.card-icon{width:40px;height:40px;border-radius:10px;background:#eef4ff;display:grid;place-items:center;color:#3b6dcc}.big{font-size:25px;display:block;margin-top:2px}.panel{padding:20px}.panel h2{font-size:17px;margin:0 0 16px}.highlight{border-color:#c9dcff;background:#f8fbff}.hero{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:24px;border:1px solid #e6eaf0;border-radius:13px;margin-bottom:18px}.hero h2{margin:0 0 5px}.muted{color:#68758a}.filters{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.search{display:flex;align-items:center;background:#fff;border:1px solid #dfe4ec;border-radius:9px;padding:0 11px;flex:1;min-width:260px}.search input{border:0;outline:0;width:100%;padding:10px}.filters select,.filters button{height:42px}select,input,textarea{border:1px solid #d9e0ea;border-radius:8px;padding:10px 11px;background:#fff;outline:none}input:focus,select:focus,textarea:focus{border-color:#7195d5;box-shadow:0 0 0 3px #7195d520}textarea{min-height:100px;resize:vertical}.primary,.secondary,.danger,.ghost{border:0;border-radius:8px;padding:10px 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}.primary{background:#1f64d6;color:#fff}.primary:hover{background:#1854b8}.secondary{background:#edf1f6;color:#2c3a50}.danger{background:#feecec;color:#b42318}.ghost{background:transparent;color:#58667b}.small{padding:6px 9px;font-size:13px}.badge{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700;background:#edf1f6;color:#566277}.green{background:#e9f8ef;color:#18794e}.blue{background:#e9f1ff;color:#2355a4}.amber{background:#fff4dc;color:#986b00}.violet{background:#f0eaff;color:#6941c6}.red{background:#feecec;color:#b42318}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #edf0f4;white-space:nowrap;font-size:14px}th{color:#6b778a;font-size:12px;text-transform:uppercase;letter-spacing:.03em}.link{color:#1e5bc6;text-decoration:none;font-weight:700}.link:hover{text-decoration:underline}.empty{text-align:center;padding:30px;color:#7c8798}.info{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.info div{display:flex;flex-direction:column;gap:4px}.form{padding:22px}.form fieldset{border:0;border-top:1px solid #e6eaf0;padding:20px 0 5px;margin:0}.form fieldset:first-child{border-top:0;padding-top:0}.form legend{font-size:14px;font-weight:800;letter-spacing:.05em;color:#43516a;margin-bottom:14px}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.form label,.stack label{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:#49566c}.form .full{grid-column:1/-1}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.loading{padding:60px;text-align:center}.error{background:#fff0f0;border:1px solid #ffc9c9;color:#a51d1d;padding:11px;border-radius:8px}.toolbar{margin-bottom:15px}.notification{display:flex;justify-content:space-between;gap:20px;background:#fff;border:1px solid #e3e8f0;border-radius:11px;padding:16px}.notification.unread{border-left:4px solid #2d6cdf}.notification p{margin:7px 0;color:#536177}.modal-backdrop{position:fixed;inset:0;background:#0c142699;display:grid;place-items:center;padding:20px;z-index:20}.modal{background:#fff;border-radius:14px;width:min(600px,100%);max-height:90vh;overflow:auto;padding:20px;box-shadow:0 20px 60px #0004}.modal-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-title h2{margin:0;font-size:19px}.stack{display:flex;flex-direction:column;gap:13px}.profile{text-align:center;padding:40px}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eef4ff,#f8fafc);padding:20px}.login-card{width:min(420px,100%);background:#fff;padding:34px;border-radius:18px;box-shadow:0 18px 55px #24314b18;text-align:center}.login-card form{text-align:left;margin:25px 0}.login-card small{color:#738095}.toast{position:fixed;right:20px;bottom:20px;z-index:50;background:#172033;color:white;padding:12px 16px;border-radius:9px;box-shadow:0 8px 30px #0003}.hidden{display:none!important}
@media(max-width:1100px){.grid.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.sidebar{width:74px}.sidebar .brand{justify-content:center;font-size:0}.sidebar .nav{justify-content:center}.main header{padding:0 14px}.content{padding:16px}.grid.cards,.grid.two{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.info{grid-template-columns:1fr}.page-title{align-items:flex-start;flex-direction:column}.page-title .button{width:100%}.notification{flex-direction:column}}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* Pátio Gestão - versão standalone.
   Mantém a comunicação com o mesmo back-end do projeto original.
   API padrão: http://localhost:4000/api
*/
const API = localStorage.getItem("api_url") || "http://localhost:4000/api";
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = v => v ? new Date(v).toLocaleDateString("pt-BR") : "—";
const fmtDateTime = v => v ? new Date(v).toLocaleString("pt-BR") : "—";
const labels={DISPONIVEL:"Disponível",RESERVADA:"Reservada",MANUTENCAO:"Manutenção",EM_TRANSITO:"Em trânsito",INDISPONIVEL:"Indisponível"};
const badgeClass={DISPONIVEL:"green",RESERVADA:"blue",MANUTENCAO:"amber",EM_TRANSITO:"violet",INDISPONIVEL:"red"};
const badge=s=>`<span class="badge ${badgeClass[s]||""}">${esc(labels[s]||s)}</span>`;
const icon={box:"▣",home:"⌂",calendar:"▣",move:"↔",wrench:"⚒",history:"↶",bell:"♢",user:"◉",truck:"▰",check:"✓",alert:"!"};

async function api(path,opts={}) {
  const headers=new Headers(opts.headers||{});
  headers.set("Content-Type","application/json");
  const token=localStorage.getItem("token"); if(token) headers.set("Authorization","Bearer "+token);
  const r=await fetch(API+path,{...opts,headers});
  const data=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error||data.message||"Erro na API");
  return data;
}
const post=(p,b)=>api(p,{method:"POST",body:JSON.stringify(b)});
const put=(p,b)=>api(p,{method:"PUT",body:JSON.stringify(b)});
const del=(p,b)=>api(p,{method:"DELETE",...(b?{body:JSON.stringify(b)}:{})});

function toast(msg){const d=document.createElement("div");d.className="toast";d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),3000)}
function errorBox(e){return `<div class="error">${esc(e?.message||e)}</div>`}
function table(headers,rows){
 return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x??"—"}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${headers.length}" class="empty">Nenhum registro encontrado.</td></tr>`}</tbody></table></div>`;
}
function page(title,body,action=""){return `<div class="page"><div class="page-title"><h1>${esc(title)}</h1>${action}</div>${body}</div>`}

let user=JSON.parse(localStorage.getItem("user")||"null");
let route=location.hash.replace(/^#/,"")||"/";
let sidebarOpen=true;

function loginView(err=""){
 $("#app").innerHTML=`<div class="login"><div class="login-card">
   <div class="brand large">${icon.box} Pátio Gestão</div>
   <p class="muted">Controle de patrimônios, operações e reservas</p>
   <form id="loginForm" class="stack">
    <label>E-mail<input id="email" type="email" value="logistica@teste.com" required></label>
    <label>Senha<input id="senha" type="password" value="Teste@123" required></label>
    ${err?errorBox(err):""}
    <button class="primary">Entrar</button>
   </form>
   <small>Teste: logistica@teste.com / Teste@123</small>
 </div></div>`;
 $("#loginForm").onsubmit=async e=>{
   e.preventDefault();
   try{const x=await post("/auth/login",{email:$("#email").value,senha:$("#senha").value});
     localStorage.setItem("user",JSON.stringify(x.user));localStorage.setItem("token",x.token);user=x.user;go("/");
   }catch(e){loginView(e.message)}
 };
}
function go(path){location.hash=path;route=path;render()}
window.addEventListener("hashchange",()=>{route=location.hash.replace(/^#/,"")||"/";render()});

function navItems(){
 const all=[
  ["/","Dashboard","home",["LOGISTICA","COMERCIAL","MANUTENCAO"]],
  ["/patrimonios","Patrimônios","box",["LOGISTICA","COMERCIAL","MANUTENCAO"]],
  ["/reservas","Reservas","calendar",["LOGISTICA","COMERCIAL"]],
  ["/movimentacoes","Movimentações","move",["LOGISTICA"]],
  ["/manutencao","Manutenção","wrench",["MANUTENCAO"]],
  ["/historico","Histórico","history",["LOGISTICA","COMERCIAL","MANUTENCAO"]],
  ["/notificacoes","Notificações","bell",["LOGISTICA","COMERCIAL","MANUTENCAO"]],
  ["/perfil","Perfil","user",["LOGISTICA","COMERCIAL","MANUTENCAO"]]
 ];
 return all.filter(x=>x[3].includes(user.role));
}
function shell(){
 const nav=navItems();
 return `<div class="app">
  <aside class="sidebar ${sidebarOpen?"":"collapsed"}">
   <div class="brand">${icon.box} ${sidebarOpen?"Pátio Gestão":""}</div>
   ${nav.map(n=>`<button class="nav ${route===n[0]?"active":""}" data-go="${n[0]}"><span>${icon[n[2]]}</span>${sidebarOpen?n[1]:""}</button>`).join("")}
   <button class="nav logout" id="logout"><span>↪</span>${sidebarOpen?"Sair":""}</button>
  </aside>
  <main class="main"><header>
   <button class="iconbtn" id="toggle">☰</button>
   <div><strong>${esc(user.nome)}</strong><span class="muted"> · ${esc(user.role)}</span></div>
   <button class="iconbtn" id="headBell">♢</button>
  </header><div class="content" id="content"><div class="loading">Carregando...</div></div></main>
 </div>`;
}
function bindShell(){
 document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 $("#toggle").onclick=()=>{sidebarOpen=!sidebarOpen;render()};
 $("#headBell").onclick=()=>go("/notificacoes");
 $("#logout").onclick=()=>{localStorage.removeItem("token");localStorage.removeItem("user");user=null;loginView()};
}

async function dashboard(){
 try{
  const d=await api("/dashboard"),c=d.counts||{};
  const cards=[["Total",d.total,icon.box],["Disponíveis",c.DISPONIVEL||0,icon.check],["Reservados",c.RESERVADA||0,icon.calendar],["Manutenção",c.MANUTENCAO||0,icon.wrench],["Em trânsito",c.EM_TRANSITO||0,icon.truck],["Indisponíveis",c.INDISPONIVEL||0,icon.alert]];
  const rows1=(d.reservas||[]).map(r=>[`<button class="link" data-go="/patrimonios/${r.patrimonio.id}">${esc(r.patrimonio.numeroPatrimonio)}</button>`,esc(r.responsavel.nome),fmtDate(r.previsaoChegada),badge(r.status)]);
  const rows2=(d.movimentos||[]).map(m=>[esc(m.patrimonio.numeroPatrimonio),esc(m.tipo.replaceAll("_"," ")),esc(m.destino||"—"),fmtDateTime(m.dataHora)]);
  $("#content").innerHTML=page(`Olá, ${user.nome.split(" ")[0]}`,
   `<div class="grid cards">${cards.map(c=>`<div class="card"><div class="card-icon">${c[2]}</div><div><div class="muted">${c[0]}</div><strong class="big">${c[1]}</strong></div></div>`).join("")}</div>
   <div class="grid two"><section class="panel"><h2>Próximas reservas / chegadas</h2>${table(["Patrimônio","Responsável","Previsão","Status"],rows1)}</section>
   <section class="panel"><h2>Últimas movimentações</h2>${table(["Patrimônio","Tipo","Destino","Data"],rows2)}</section></div>`);
  bindContentLinks();
 }catch(e){$("#content").innerHTML=page("Dashboard",errorBox(e))}
}

function bindContentLinks(){document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go))}

async function patrimonios(){
 let q="",status="";
 const load=async()=>{
  try{
   const items=await api(`/patrimonios?q=${encodeURIComponent(q)}${status?`&status=${status}`:""}`);
   const rows=items.map(p=>[
    `<button class="link" data-go="/patrimonios/${p.id}">${esc(p.numeroPatrimonio)}</button>`,
    esc(`${p.marca} ${p.modelo}`),esc(p.categoria?.nome||""),esc(p.ano),badge(p.status),esc(p.localizacao),
    `<button class="secondary small" data-go="/patrimonios/${p.id}">Detalhes</button>`]);
   $("#results").innerHTML=table(["Patrimônio","Marca / Modelo","Categoria","Ano","Status","Localização",""],rows);bindContentLinks();
  }catch(e){$("#results").innerHTML=errorBox(e)}
 };
 $("#content").innerHTML=page("Patrimônios",`<div class="filters"><div class="search">⌕<input id="q" placeholder="Patrimônio, chassi, marca, modelo..."></div>
 <select id="status"><option value="">Todos os status</option>${Object.keys(labels).map(s=>`<option value="${s}">${labels[s]}</option>`).join("")}</select>
 <button class="secondary" id="refresh">↻ Atualizar</button></div><section class="panel"><div id="results"><div class="loading">Carregando...</div></div></section>`,
 user.role==="LOGISTICA"?`<button class="primary button" id="newPat">＋ Novo patrimônio</button>`:"");
 $("#newPat")?.addEventListener("click",()=>go("/patrimonios/novo"));
 $("#q").oninput=e=>q=e.target.value;$("#q").onkeydown=e=>{if(e.key==="Enter")load()};
 $("#status").onchange=e=>{status=e.target.value;load()};$("#refresh").onclick=load;load();
}

const emptyForm={numeroPatrimonio:"",chassi:"",marca:"",modelo:"",categoria:"Escavadeira",ano:2024,tamanho:"MEDIO",comprimento:1,largura:1,altura:1,grauInclinacao:0,bateria:"",tipoFuncionamento:"DIESEL",tipoOutro:"",especificacoes:"",status:"DISPONIVEL",localizacao:"Pátio principal"};
function field(label,key,value,type="text"){return `<label>${label}<input data-field="${key}" type="${type}" value="${esc(value)}"></label>`}
function selectField(label,key,value,opts){return `<label>${label}<select data-field="${key}">${opts.map(o=>`<option ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select></label>`}
async function patrimonioForm(id){
 if(user.role!=="LOGISTICA"){ $("#content").innerHTML=page("Sem permissão",`<div class="error">403 Forbidden</div>`);return }
 let f={...emptyForm};
 if(id){try{const p=await api(`/patrimonios/${id}`);f={...p,categoria:p.categoria?.nome||""}}catch(e){$("#content").innerHTML=page("Erro",errorBox(e));return}}
 $("#content").innerHTML=page(id?"Editar patrimônio":"Novo patrimônio",`<form class="form panel" id="patForm">
 <fieldset><legend>IDENTIFICAÇÃO</legend><div class="form-grid">
 ${field("Número do patrimônio","numeroPatrimonio",f.numeroPatrimonio)}${field("Chassi","chassi",f.chassi||"")}${field("Marca","marca",f.marca)}${field("Modelo","modelo",f.modelo)}${field("Categoria","categoria",f.categoria)}${field("Ano","ano",f.ano,"number")}</div></fieldset>
 <fieldset><legend>DIMENSÕES PARA CARREGAMENTO</legend><div class="form-grid">${field("Comprimento (m)","comprimento",f.comprimento,"number")}${field("Largura (m)","largura",f.largura,"number")}${field("Altura (m)","altura",f.altura,"number")}</div></fieldset>
 <fieldset><legend>CARACTERÍSTICAS OPERACIONAIS</legend><div class="form-grid">${selectField("Tamanho","tamanho",f.tamanho,["PEQUENO","MEDIO","GRANDE"])}${field("Grau de inclinação (°)","grauInclinacao",f.grauInclinacao,"number")}${field("Bateria","bateria",f.bateria||"")}${selectField("Tipo de funcionamento","tipoFuncionamento",f.tipoFuncionamento,["DIESEL","ELETRICO","GASOLINA","HIBRIDO","OUTRO"])}${f.tipoFuncionamento==="OUTRO"?field("Especificação do tipo","tipoOutro",f.tipoOutro||""):""}</div></fieldset>
 <fieldset><legend>SITUAÇÕES ESPECIAIS</legend><label class="full">Especificações<textarea data-field="especificacoes">${esc(f.especificacoes||"")}</textarea></label></fieldset>
 <fieldset><legend>OPERAÇÃO</legend><div class="form-grid">${selectField("Status","status",f.status,Object.keys(labels))}${field("Localização atual","localizacao",f.localizacao)}</div></fieldset>
 <div id="formErr"></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancelar</button><button class="primary">Salvar patrimônio</button></div></form>`);
 $("#cancel").onclick=()=>go("/patrimonios");
 $("#patForm").onsubmit=async e=>{
  e.preventDefault();const data={...f};document.querySelectorAll("[data-field]").forEach(el=>{let v=el.value;if(["ano","comprimento","largura","altura","grauInclinacao"].includes(el.dataset.field))v=Number(v);data[el.dataset.field]=v});
  try{if(id)await put(`/patrimonios/${id}`,data);else await post("/patrimonios",data);toast("Patrimônio salvo com sucesso");go("/patrimonios")}catch(e){$("#formErr").innerHTML=errorBox(e)}
 };
}

async function patrimonioDetail(id){
 try{
  const p=await api(`/patrimonios/${id}`),can=user.role==="LOGISTICA";
  const res=(p.reservas||[]).map(r=>[esc(r.responsavel.nome),fmtDate(r.dataReserva),fmtDate(r.previsaoChegada),badge(r.status)]);
  const hist=(p.historicos||[]).map(h=>[fmtDateTime(h.dataHora),esc(h.usuario.nome),esc(h.acao),`${esc(h.statusAnterior||"—")} → ${esc(h.novoStatus||"—")}`,esc(h.observacao||"—")]);
  $("#content").innerHTML=page(p.numeroPatrimonio,`<div class="hero"><div><h2>${esc(p.marca)} ${esc(p.modelo)}</h2><div class="muted">${esc(p.categoria?.nome||"")} · ${esc(p.ano)}</div></div>${badge(p.status)}</div>
   <div class="grid two"><section class="panel"><h2>Identificação</h2>${info([["Patrimônio",p.numeroPatrimonio],["Chassi",p.chassi||"—"],["Marca",p.marca],["Modelo",p.modelo],["Categoria",p.categoria?.nome||"—"],["Ano",p.ano]])}</section>
   <section class="panel highlight"><h2>INFORMAÇÕES PARA CARREGAMENTO</h2>${info([["Comprimento",Number(p.comprimento).toFixed(2)+" m"],["Largura",Number(p.largura).toFixed(2)+" m"],["Altura",Number(p.altura).toFixed(2)+" m"],["Grau de inclinação",p.grauInclinacao+"°"],["Tipo de funcionamento",p.tipoFuncionamento==="OUTRO"?p.tipoOutro:p.tipoFuncionamento],["Bateria",p.bateria||"—"],["Especificações especiais",p.especificacoes||"—"]])}</section>
   <section class="panel"><h2>Características operacionais</h2>${info([["Tamanho",p.tamanho],["Status",badge(p.status)],["Localização",p.localizacao]])}</section>
   <section class="panel"><h2>Reservas relacionadas</h2>${table(["Responsável","Data","Previsão","Status"],res)}</section></div>
   <section class="panel"><h2>Histórico recente</h2>${table(["Data","Usuário","Ação","Status","Observação"],hist)}</section>`,
   `<div class="actions">${can?`<button class="secondary" id="edit">Editar</button><button class="danger" id="delete">Excluir</button>`:""}</div>`);
  $("#edit")?.addEventListener("click",()=>go(`/patrimonios/${id}/editar`));
  $("#delete")?.addEventListener("click",async()=>{if(confirm("Excluir patrimônio?"))try{await del(`/patrimonios/${id}`);toast("Patrimônio excluído");go("/patrimonios")}catch(e){toast(e.message)}});
 }catch(e){$("#content").innerHTML=page("Patrimônio",errorBox(e))}
}
function info(rows){return `<div class="info">${rows.map(r=>`<div><span class="muted">${esc(r[0])}</span><strong>${r[1]??"—"}</strong></div>`).join("")}</div>`}

async function reservas(){
 let items=[],pats=[];
 try{[items,pats]=await Promise.all([api("/reservas"),api("/patrimonios?status=DISPONIVEL")])}catch(e){$("#content").innerHTML=page("Reservas",errorBox(e));return}
 const rows=items.map(r=>[`<button class="link" data-go="/patrimonios/${r.patrimonio.id}">${esc(r.patrimonio.numeroPatrimonio)}</button>`,esc(`${r.patrimonio.marca} ${r.patrimonio.modelo}`),esc(r.responsavel.nome),fmtDate(r.previsaoChegada),badge(r.status),(["ATIVA","IMPACTADA_MANUTENCAO"].includes(r.status)&&(user.role==="LOGISTICA"||r.responsavelId===user.id))?`<button class="danger small" data-cancel="${r.id}">Cancelar</button>`:"—"]);
 $("#content").innerHTML=page("Reservas",`<section class="panel">${table(["Patrimônio","Marca / Modelo","Responsável","Previsão","Status","Ações"],rows)}</section>`,`<button class="primary" id="newReserve">＋ Nova reserva</button>`);
 bindContentLinks();
 document.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=async()=>{const motivo=prompt("Motivo do cancelamento:");if(motivo)try{await del(`/reservas/${b.dataset.cancel}`,{motivo});reservas()}catch(e){toast(e.message)}});
 $("#newReserve").onclick=()=>reserveModal(pats);
}
async function reserveModal(pats){
 let responsaveis=[];
 if(user.role==="LOGISTICA")try{responsaveis=await api("/usuarios/responsaveis")}catch(e){}
 const modal=document.createElement("div");modal.className="modal-backdrop";modal.innerHTML=`<div class="modal"><div class="modal-title"><h2>Nova reserva</h2><button class="iconbtn" id="close">×</button></div>
 <form class="stack" id="reserveForm"><label>Patrimônio<select id="rp" required><option value="">Selecione</option>${pats.map(p=>`<option value="${p.id}">${esc(p.numeroPatrimonio)} — ${esc(p.marca)} ${esc(p.modelo)}</option>`).join("")}</select></label>
 ${user.role==="LOGISTICA"?`<label>Reserva em nome de<select id="ru" required><option value="">Selecione o responsável</option>${responsaveis.map(u=>`<option value="${u.id}">${esc(u.nome)} — ${esc(u.role)}</option>`).join("")}</select></label>`:""}
 <label>Data prevista de chegada<input id="rd" type="datetime-local"></label><label>Observações<textarea id="ro"></textarea></label><div id="re"></div><button class="primary">Criar reserva</button></form></div>`;
 document.body.appendChild(modal);$("#close").onclick=()=>modal.remove();
 $("#reserveForm").onsubmit=async e=>{e.preventDefault();try{await post("/reservas",{patrimonioId:Number($("#rp").value),responsavelId:user.role==="LOGISTICA"?Number($("#ru").value):undefined,previsaoChegada:$("#rd").value?new Date($("#rd").value).toISOString():null,observacoes:$("#ro").value});modal.remove();toast("Reserva criada");reservas()}catch(e){$("#re").innerHTML=errorBox(e)}}
}

async function movimentacoes(){try{const x=await api("/movimentacoes");$("#content").innerHTML=page("Movimentações",`<section class="panel">${table(["Patrimônio","Tipo","Origem","Destino","Usuário","Data / hora","Observação"],x.map(m=>[esc(m.patrimonio.numeroPatrimonio),esc(m.tipo.replaceAll("_"," ")),esc(m.origem||"—"),esc(m.destino||"—"),esc(m.usuario.nome),fmtDateTime(m.dataHora),esc(m.observacao||"—")]))}</section>`)}catch(e){$("#content").innerHTML=page("Movimentações",errorBox(e))}}
async function manutencao(){
 try{
  const pats=await api("/patrimonios");
  $("#content").innerHTML=page("Manutenção",`<div class="toolbar">Selecione uma máquina para iniciar manutenção.</div><section class="panel">${table(["Patrimônio","Modelo","Status","Localização","Ação"],pats.map(p=>[esc(p.numeroPatrimonio),esc(`${p.marca} ${p.modelo}`),badge(p.status),esc(p.localizacao),p.status==="DISPONIVEL"||p.status==="RESERVADA"?`<button class="secondary small" data-maint="${p.id}">Enviar para manutenção</button>`:p.status==="MANUTENCAO"?`<button class="primary small" data-ret="${p.id}">Retirar da manutenção</button>`:"—"]))}</section>`);
  document.querySelectorAll("[data-maint]").forEach(b=>b.onclick=async()=>{const p=pats.find(x=>x.id==b.dataset.maint);try{await post(`/patrimonios/${p.id}/manutencao`,{motivo:"Manutenção operacional",modo:"NORMAL"});manutencao()}catch(e){if(e.message.includes("RESERVA_CONFLITO"))maintenanceConflict(p);else toast(e.message)}});
  document.querySelectorAll("[data-ret]").forEach(b=>b.onclick=async()=>{try{await del(`/patrimonios/${b.dataset.ret}/manutencao`);manutencao()}catch(e){toast(e.message)}});
 }catch(e){$("#content").innerHTML=page("Manutenção",errorBox(e))}
}
function maintenanceConflict(p){
 const modal=document.createElement("div");modal.className="modal-backdrop";modal.innerHTML=`<div class="modal"><div class="modal-title"><h2>⚠️ Reserva ativa</h2><button class="iconbtn" id="mc">×</button></div><p>Esta máquina possui uma reserva ativa. Como deseja proceder?</p><div class="stack"><button class="primary" id="sub">1 — TROCAR POR UMA MÁQUINA PARECIDA</button><button class="secondary" id="imp">2 — AVISAR O COMERCIAL E ENVIAR PARA MANUTENÇÃO</button><button class="ghost" id="no">CANCELAR</button></div></div>`;
 document.body.appendChild(modal);$("#mc").onclick=$("#no").onclick=()=>modal.remove();
 $("#sub").onclick=async()=>{try{const r=await api(`/patrimonios/${p.id}/substitutos`);const x=r[0];if(!x)throw new Error("Não foram encontradas máquinas compatíveis disponíveis para substituição.");if(confirm(`Confirmar substituição?\nOriginal: ${p.numeroPatrimonio}\nSubstituta: ${x.numeroPatrimonio}`)){const rs=await api("/reservas");const rr=rs.find(z=>z.patrimonioId===p.id&&z.status==="ATIVA");await post(`/reservas/${rr.id}/substituir`,{substitutoId:x.id,motivo:"Máquina original será enviada para manutenção."});modal.remove();manutencao()}}catch(e){toast(e.message)}};
 $("#imp").onclick=async()=>{try{const rs=await api("/reservas");const rr=rs.find(z=>z.patrimonioId===p.id&&z.status==="ATIVA");if(!rr)throw new Error("Reserva ativa não encontrada");await post(`/reservas/${rr.id}/impactar-manutencao`,{motivo:"Máquina original será enviada para manutenção."});modal.remove();manutencao()}catch(e){toast(e.message)}};
}
async function historico(){try{const x=await api("/historico");$("#content").innerHTML=page("Histórico",`<section class="panel">${table(["Data","Usuário","Role","Patrimônio","Ação","Status","Observação"],x.map(h=>[fmtDateTime(h.dataHora),esc(h.usuario.nome),esc(h.role),esc(h.patrimonio?.numeroPatrimonio||"—"),esc(h.acao),`${esc(h.statusAnterior||"—")} → ${esc(h.novoStatus||"—")}`,esc(h.observacao||"—")]))}</section>`)}catch(e){$("#content").innerHTML=page("Histórico",errorBox(e))}}
async function notificacoes(){try{const x=await api("/notificacoes");$("#content").innerHTML=page("Notificações",`<div class="stack">${x.map(n=>`<div class="notification ${n.lida?"":"unread"}"><div><strong>${esc(n.titulo)}</strong><p>${esc(n.mensagem)}</p><small>${fmtDateTime(n.dataHora)}</small></div>${!n.lida?`<button class="secondary small" data-read="${n.id}">Marcar como lida</button>`:""}</div>`).join("")}</div>`);document.querySelectorAll("[data-read]").forEach(b=>b.onclick=async()=>{try{await put(`/notificacoes/${b.dataset.read}/lida`,{});notificacoes()}catch(e){toast(e.message)}})}catch(e){$("#content").innerHTML=page("Notificações",errorBox(e))}}
function perfil(){ $("#content").innerHTML=page("Perfil",`<section class="panel profile"><div style="font-size:56px">${icon.user}</div><h2>${esc(user.nome)}</h2><p>${esc(user.email)}</p>${badge(user.role)}</section>`)}

async function render(){
 if(!user){loginView();return}
 $("#app").innerHTML=shell();bindShell();
 if(route==="/")dashboard();
 else if(route==="/patrimonios")patrimonios();
 else if(route==="/patrimonios/novo")patrimonioForm();
 else if(/^\/patrimonios\/\d+\/editar$/.test(route))patrimonioForm(Number(route.split("/")[2]));
 else if(/^\/patrimonios\/\d+$/.test(route))patrimonioDetail(Number(route.split("/")[2]));
 else if(route==="/reservas")reservas();
 else if(route==="/movimentacoes")movimentacoes();
 else if(route==="/manutencao")manutencao();
 else if(route==="/historico")historico();
 else if(route==="/notificacoes")notificacoes();
 else if(route==="/perfil")perfil();
 else {go("/");}
}
render();
</script>
</body>
</html>
